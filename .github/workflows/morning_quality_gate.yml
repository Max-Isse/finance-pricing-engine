name: Morning Production Quality Gate
on:
  schedule:
    - cron: '0 6 * * 1-5' # 06:00 AM UTC, Monday-Friday
  workflow_dispatch:

jobs:
  run-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hardened Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy torch great_expectations

      - name: Execute Quality Tests
        id: run_tests
        run: |
          python -c "
          import json, os
          print('Evaluating metrics against config/expectations_macro.json...')
          # Simulated test validation execution
          if not os.path.exists('config/expectations_macro.json'):
              raise FileNotFoundError('Configuration Missing')
          "
          
      - name: Fallback Trigger on Failure
        if: failure()
        run: |
          echo "Quality Gate Failed! Activating fallback routing matrix..."
          python pipelines/fallback_injector.py --reason "Stale Upstream Data"