name: Morning Production Quality Gate
on:
  schedule:
    - cron: '0 6 * * 1-5' # 06:00 AM UTC, Monday-Friday
  workflow_dispatch:

jobs:
  run-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.0 numpy==1.26.4

      # There is no real upstream feed, so the gate checks a freshly simulated one.
      - name: Run data-quality gate
        run: python pipelines/quality_gate.py --simulate

      - name: Fallback trigger on failure
        if: failure()
        run: python pipelines/fallback_injector.py --reason "Stale Upstream Data"
