version: '3.8'

services:
  inference-service:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    depends_on:
      - redis-cache
    deploy:
      resources:
        limits:
          memory: 8g   # Increase this depending on your host machine's RAM
        reservations:
          memory: 2g

  redis-cache:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"