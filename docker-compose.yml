services:
  inference-service:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
    depends_on:
      - redis-cache

  redis-cache:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
